services:
  temporal:
    image: temporalio/temporal:1.10.1
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --ui-ip=0.0.0.0
      - --port=7233
      - --ui-port=8233
      - --db-filename=/home/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address=127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build: .
    init: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: managed-agent
    depends_on:
      temporal:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  temporal-data:
